# Every push: the CPU encoder's conformance suite, and every device path on a
# real OpenCL device (PoCL, an OpenCL implementation that runs on the CPU), and
# the CUDA kernels through NVRTC.  No GPU is needed for any of it; what these
# jobs prove is that the device paths are *correct* -- byte-identical to the
# CPU encoder -- not that they are fast.  See docs/STATUS.md, "GPU groundwork
# on a real OpenCL device".
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # the same ffmpeg build the conformance cases were written against
  FFMPEG: ${{ github.workspace }}/.ci/ext/imageio_ffmpeg/binaries/ffmpeg-linux-x86_64-v7.0.2

jobs:
  cpu:
    name: CPU build, make test, frame threads
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # a Python that pip may install into (the runner's system Python is
      # "externally managed", PEP 668); only the tools come from pip --
      # ffmpeg, PoCL, NVRTC -- the encoder itself uses no Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: .ci/ext
          key: ffmpeg-imageio-v7.0.2
      - name: ffmpeg 7.0.2
        run: |
          [ -x "$FFMPEG" ] || python3 -m pip install -q --target .ci/ext imageio-ffmpeg
          "$FFMPEG" -version | head -n 1
      - name: build
        run: make -j"$(nproc)"
      - name: make test
        # (the job shell is bash -eo pipefail, so tee keeps the exit status;
        # the grep makes a silently skipped conformance run -- no ffmpeg --
        # a failure instead of a green tick)
        run: |
          make test | tee /tmp/mt
          grep -q "all conformance cases bit-exact" /tmp/mt
      - name: frame threads write the serial stream
        run: |
          make -s build/genyuv
          ./build/genyuv 320 192 40 /tmp/ft.yuv 1
          for p in 1 3 4; do
            ./build/aegenc -w 320 -h 192 -n 40 -q 26 -p $p -i /tmp/ft.yuv \
                -o /tmp/s.264 --frame-threads 1 -v 0
            ./build/aegenc -w 320 -h 192 -n 40 -q 26 -p $p -i /tmp/ft.yuv \
                -o /tmp/f.264 --frame-threads 4 -v 0
            cmp /tmp/s.264 /tmp/f.264
            echo "preset $p: frame threads identical"
          done
      - name: library packaging (shared + static, pkg-config, exports)
        # make install into a scratch DESTDIR; the example built against it
        # through pkg-config, shared and static; exported symbols = AEG_API
        run: REQUIRE_PKG_CONFIG=1 make install-check
      - name: system install, example through pkg-config
        run: |
          sudo make install PREFIX=/usr/local
          sudo ldconfig
          cc -Wall -Wextra -Werror examples/encode.c \
              $(pkg-config --cflags --libs aeg) -o /tmp/encode_example
          ldd /tmp/encode_example | grep libaeg.so.0
          ./build/genyuv 176 144 10 /tmp/ex.yuv 4
          /tmp/encode_example /tmp/ex.yuv 176 144 /tmp/ex.264 24
          sudo make uninstall PREFIX=/usr/local

  opencl-pocl:
    name: OpenCL backend on PoCL
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # a Python that pip may install into (the runner's system Python is
      # "externally managed", PEP 668); only the tools come from pip --
      # ffmpeg, PoCL, NVRTC -- the encoder itself uses no Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: .ci/ext
          key: ffmpeg-imageio-v7.0.2
      - name: ffmpeg 7.0.2
        run: |
          [ -x "$FFMPEG" ] || python3 -m pip install -q --target .ci/ext imageio-ffmpeg
      - name: PoCL (the distribution's OpenCL runtime on the CPU)
        # Ubuntu's PoCL and the system ICD loader: found by the encoder's
        # usual libOpenCL.so.1 lookup, no environment needed.  (The pip wheel
        # tools/pocl_env.sh installs -- PoCL 3.0-rc2, LLVM 14, from 2022 --
        # failed to enumerate on some runners, intermittently.)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            pocl-opencl-icd ocl-icd-libopencl1 >/dev/null
          ls /etc/OpenCL/vendors
      - name: build (OPENCL=1)
        run: |
          make -j"$(nproc)" OPENCL=1
          make -s OPENCL=1 build/backend_check build/genyuv
      - name: device present
        run: |
          sh tools/ci_device_check.sh ./build/aegenc
      - name: backend_check (every device operation, two threads)
        run: |
          ./build/backend_check opencl | tee /tmp/bc
          grep -q "checks agree" /tmp/bc
      - name: conformance suite through the device
        run: |
          BUILD=./build AEG_TEST_BACKEND=opencl sh tests/run_tests.sh 2>&1 | tee /tmp/rt
          if ! grep -q "all conformance cases bit-exact" /tmp/rt || grep -q skipped /tmp/rt; then
            # the job log is not always reachable; an annotation is (gh api
            # .../check-runs/ID/annotations)
            msg=$(grep -v "bit-exact (" /tmp/rt | tail -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=conformance through the device::$msg"
            exit 1
          fi
      - name: gpu_validate (device paths byte-identical to the CPU)
        run: |
          ./build/genyuv 320 192 16 /tmp/v.yuv 1
          BE=opencl tools/gpu_validate.sh /tmp/v.yuv 320 192 16 26 -p 3 -t 1
          BE=opencl tools/gpu_validate.sh /tmp/v.yuv 320 192 16 26 -p 2 -t 2

  cuda-nvrtc:
    name: CUDA kernels through NVRTC
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # a Python that pip may install into (the runner's system Python is
      # "externally managed", PEP 668); only the tools come from pip --
      # ffmpeg, PoCL, NVRTC -- the encoder itself uses no Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: .ci/nvrtc
          key: nvrtc-cu12-v1
      - name: NVRTC (pip, no toolkit, no driver)
        run: |
          [ -d .ci/nvrtc/nvidia ] ||
            python3 -m pip install -q --target .ci/nvrtc nvidia-cuda-nvrtc-cu12
      - name: build (CUDA=1 OPENCL=1)
        run: |
          make -j"$(nproc)" CUDA=1 OPENCL=1
          make -s CUDA=1 OPENCL=1 build/nvrtc_check
      - name: nvrtc_check (every supported architecture)
        run: |
          AEG_NVRTC_LIB=$(ls .ci/nvrtc/nvidia/cuda_nvrtc/lib/libnvrtc.so.* | head -n 1) \
            ./build/nvrtc_check | tee /tmp/nv
          grep -q "kernels compile" /tmp/nv

  sanitizers:
    name: ASan + UBSan (CPU and the OpenCL host side), TSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # a Python that pip may install into (the runner's system Python is
      # "externally managed", PEP 668); only the tools come from pip --
      # ffmpeg, PoCL, NVRTC -- the encoder itself uses no Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: .ci/ext
          key: ffmpeg-imageio-v7.0.2
      - name: ffmpeg 7.0.2
        run: |
          [ -x "$FFMPEG" ] || python3 -m pip install -q --target .ci/ext imageio-ffmpeg
      - name: PoCL (the distribution's OpenCL runtime on the CPU)
        # Ubuntu's PoCL and the system ICD loader: found by the encoder's
        # usual libOpenCL.so.1 lookup, no environment needed.  (The pip wheel
        # tools/pocl_env.sh installs -- PoCL 3.0-rc2, LLVM 14, from 2022 --
        # failed to enumerate on some runners, intermittently.)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            pocl-opencl-icd ocl-icd-libopencl1 >/dev/null
          ls /etc/OpenCL/vendors
      - name: build with sanitizers
        env:
          # from the environment, not the make command line: the Makefile
          # appends its include paths to CFLAGS, which a command-line CFLAGS
          # would override
          CFLAGS: -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
        run: |
          make -j"$(nproc)" OPENCL=1 BUILD=build-san
          make -s OPENCL=1 BUILD=build-san build-san/backend_check \
            build-san/kernel_check build-san/coef_check build-san/genyuv \
            build-san/api_check build-san/input_check
      - name: unit checks
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          ./build-san/kernel_check
          ./build-san/coef_check 20000
          ./build-san/input_check
      - name: public API (leak detection on)
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ./build-san/api_check
      - name: backend_check on PoCL (host transfers stay inside the buffers)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          sh tools/ci_device_check.sh ./build-san/aegenc
          ./build-san/backend_check opencl | tee /tmp/bc
          grep -q "checks agree" /tmp/bc
      - name: encodes (CPU and device paths, B pictures, slice and frame threads)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          ./build-san/genyuv 176 144 12 /tmp/s.yuv 1
          B=./build-san/aegenc
          A="-w 176 -h 144 -n 12 -q 26 -i /tmp/s.yuv -v 0"
          for p in 0 2 4; do
            $B $A -p $p -b cpu -o /tmp/c.264
            $B $A -p $p -b cpu -t 2 -o /tmp/t.264
            $B $A -p $p -b cpu --frame-threads 3 -o /tmp/f.264
            AEG_RD_BATCH=1 $B $A -p $p -b opencl -t 2 -o /tmp/o.264
            AEG_SEED=1 AEG_PARFULL=1 $B $A -p $p -b opencl -s inter=opencl -o /tmp/s.264
            cmp /tmp/t.264 /tmp/o.264 || { echo "rd batch differs at preset $p" >&2; exit 1; }
            cmp /tmp/c.264 /tmp/f.264 || { echo "frame threads differ at preset $p" >&2; exit 1; }
          done
      - name: rate control and two-pass statistics at the edges
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          sh tools/robust_sweep.sh ./build-san/aegenc /tmp/sweep
      - name: ThreadSanitizer (encoders in parallel threads, frame threads)
        env:
          CFLAGS: -O1 -g -fsanitize=thread
          LDFLAGS: -fsanitize=thread
          TSAN_OPTIONS: halt_on_error=1
        # setarch -R: TSan's shadow memory cannot cope with the runner
        # kernel's address space randomisation (vm.mmap_rnd_bits = 32)
        run: |
          make -s -j"$(nproc)" BUILD=build-tsan build-tsan/api_check \
            build-tsan/aegenc build-tsan/genyuv
          setarch -R ./build-tsan/api_check
          ./build-tsan/genyuv 176 144 16 /tmp/ts.yuv 1
          for p in 1 3; do
            for t in "--frame-threads 3" "-t 2"; do
              setarch -R ./build-tsan/aegenc -w 176 -h 144 -n 16 -q 26 -p $p \
                -i /tmp/ts.yuv $t -v 0 -o /tmp/ts.264
            done
          done
